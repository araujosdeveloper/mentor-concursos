http_port 3128
visible_hostname mentor-concursos-egress-proxy

acl CONNECT method CONNECT
acl SSL_ports port 443
acl Safe_ports port 80 443
acl blocked_private dst 0.0.0.0/8
acl blocked_private dst 10.0.0.0/8
acl blocked_private dst 100.64.0.0/10
acl blocked_private dst 127.0.0.0/8
acl blocked_private dst 169.254.0.0/16
acl blocked_private dst 172.16.0.0/12
acl blocked_private dst 192.0.0.0/24
acl blocked_private dst 192.0.2.0/24
acl blocked_private dst 192.168.0.0/16
acl blocked_private dst 198.18.0.0/15
acl blocked_private dst 198.51.100.0/24
acl blocked_private dst 203.0.113.0/24
acl blocked_private dst 224.0.0.0/4
acl blocked_private dst 240.0.0.0/4
acl blocked_private dst ::/128
acl blocked_private dst ::1/128
acl blocked_private dst fc00::/7
acl blocked_private dst fe80::/10
acl allowed_domains dstdomain "/etc/squid/allowlist-domains.txt"

http_access allow localhost manager
http_access deny manager
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access deny blocked_private
http_access allow allowed_domains
http_access deny all

cache deny all
cache_store_log none
via on
forwarded_for delete

logformat mentor_safe %ts.%03tu %>a %Ss/%03>Hs %rm %>rd
access_log stdio:/var/log/squid/access.log mentor_safe
cache_log stdio:/var/log/squid/cache.log
pid_filename /run/squid/squid.pid
coredump_dir /tmp
pinger_enable off
