# Catálogo estruturado de fontes oficiais para consulta externa controlada.
#
# Regras (ADR-020):
# - Somente sites oficiais; nenhuma busca web genérica, crawler ou espelhamento.
# - `canonical_url` vazio (`null`) significa "confirmar URL no portal oficial
#   no momento da aquisição"; a aquisição valida host, HTTPS, SSRF e MIME.
# - Jurisprudência usa busca controlada por domínio, paginação limitada e
#   revisão humana; nunca há promoção automática.

