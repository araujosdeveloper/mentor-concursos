name: Validate foundation

on:
  push:
    branches: [feat/foundation]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build isolated validation image
        run: docker build --pull=false --file Dockerfile.validation --tag mentor-concursos-validation:0.1.0 .
      - name: Run tests, lint and compile without network
        run: >-
          docker run --rm --network none --read-only
          --tmpfs /tmp:size=512m
          mentor-concursos-validation:0.1.0
          sh -c 'python -m compileall -q apps tests && python -m pytest -p no:cacheprovider && ruff check --no-cache .'
      - name: Verify dependency locks
        run: >-
          docker run --rm --read-only --tmpfs /tmp:size=512m
          mentor-concursos-validation:0.1.0
          ./scripts/verify-lock.sh
      - name: Audit Python dependencies
        run: >-
          docker run --rm --read-only --tmpfs /tmp:size=256m --tmpfs /root/.cache:size=64m
          mentor-concursos-validation:0.1.0
          pip-audit --disable-pip -r requirements.lock
      - name: Validate repository invariants
        run: |
          POSTGRES_DB=mentor_concursos \
          POSTGRES_USER=validation_user \
          POSTGRES_PASSWORD=validation-only-not-a-secret \
          REDIS_PASSWORD=validation-only-not-a-secret \
            docker compose config --quiet
          docker run --rm --read-only --tmpfs /tmp:size=512m \
            -e FOUNDATION_COMPOSE_PREVALIDATED=1 \
            mentor-concursos-validation:0.1.0 ./scripts/validate-foundation.sh
