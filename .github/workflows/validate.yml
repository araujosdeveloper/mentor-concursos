name: Validate foundation

on:
  push:
    branches: [feat/foundation]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Bootstrap lock verifier
        run: |
          python -m pip install --force-reinstall --no-deps 'pip==25.1.1'
          python -m pip install --no-deps \
            'build==1.6.0' 'click==8.5.0' 'pip-api==0.0.35' \
            'pip-requirements-parser==32.0.1' 'pip-tools==7.5.0' \
            'pyproject-hooks==1.2.0' 'setuptools==84.0.0'
      - name: Verify dependency locks
        run: ./scripts/verify-lock.sh
      - name: Install hashed development dependencies
        run: python -m pip install --require-hashes --no-deps -r requirements-dev.lock
      - name: Audit Python dependencies
        run: pip-audit --disable-pip -r requirements.lock
      - name: Validate foundation without starting containers
        run: ./scripts/validate-foundation.sh
