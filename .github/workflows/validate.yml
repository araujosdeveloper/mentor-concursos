name: Validate foundation

on:
  push:
    branches: [feat/foundation]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install locked project dependencies
        run: python -m pip install -e '.[dev]'
      - name: Validate foundation without starting containers
        run: ./scripts/validate-foundation.sh
