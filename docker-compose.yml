name: mentor-concursos

x-service-security: &service-security
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true

services:
  mentor-concursos-api:
    <<: *service-security
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: mentor-concursos-api:0.1.0
    environment:
      APP_ENV: ${APP_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TZ: ${TZ:-America/Sao_Paulo}
      DATABASE_HOST: mentor-concursos-postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: ${POSTGRES_DB:?POSTGRES_DB is required}
      DATABASE_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      REDIS_HOST: mentor-concursos-redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    expose: ["8080"]
    networks: [mentor-concursos-core, mentor-concursos-agent]
    depends_on:
      mentor-concursos-postgres: {condition: service_healthy}
      mentor-concursos-redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    cpus: "0.35"
    mem_limit: 384m

  mentor-concursos-worker:
    <<: *service-security
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    image: mentor-concursos-worker:0.1.0
    environment:
      APP_ENV: ${APP_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TZ: ${TZ:-America/Sao_Paulo}
      DATABASE_HOST: mentor-concursos-postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: ${POSTGRES_DB:?POSTGRES_DB is required}
      DATABASE_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      REDIS_HOST: mentor-concursos-redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      TIKA_URL: http://mentor-concursos-tika:9998
    networks: [mentor-concursos-core]
    depends_on:
      mentor-concursos-postgres: {condition: service_healthy}
      mentor-concursos-redis: {condition: service_healthy}
      mentor-concursos-tika: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-m", "apps.worker.src.main", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    cpus: "0.50"
    mem_limit: 512m

  mentor-concursos-postgres:
    <<: *service-security
    image: pgvector/pgvector:0.8.0-pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - mentor_concursos_postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    networks: [mentor-concursos-core]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    cpus: "0.65"
    mem_limit: 1536m

  mentor-concursos-redis:
    <<: *service-security
    image: redis:7.4.2-alpine3.21
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes: [mentor_concursos_redis_data:/data]
    networks: [mentor-concursos-core]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    cpus: "0.20"
    mem_limit: 256m

  mentor-concursos-tika:
    <<: *service-security
    image: apache/tika:3.2.2.0-full
    networks: [mentor-concursos-core]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:9998/version >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    cpus: "0.45"
    mem_limit: 1024m

  mentor-concursos-hermes:
    <<: *service-security
    image: ${HERMES_IMAGE:?HERMES_IMAGE with immutable version and digest is required}
    environment:
      MENTOR_API_BASE_URL: http://mentor-concursos-api:8080
      TZ: ${TZ:-America/Sao_Paulo}
    volumes: [mentor_concursos_hermes_data:/var/lib/hermes]
    networks: [mentor-concursos-agent]
    depends_on:
      mentor-concursos-api: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "test -d /var/lib/hermes"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    cpus: "0.60"
    mem_limit: 1536m

networks:
  mentor-concursos-core:
    name: mentor-concursos-core
    internal: true
  mentor-concursos-agent:
    name: mentor-concursos-agent
    internal: true

volumes:
  mentor_concursos_postgres_data: {name: mentor_concursos_postgres_data}
  mentor_concursos_redis_data: {name: mentor_concursos_redis_data}
  mentor_concursos_hermes_data: {name: mentor_concursos_hermes_data}
